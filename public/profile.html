<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="page.profil_tsifrovoy_dekanat"></title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#13245a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Деканат">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <script src="/js/theme.js"></script>
  <script src="/i18n/ru.js"></script>
  <script src="/i18n/en.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/pwa.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="has-bottom-nav journal">
  <a class="skip-link" href="#main" data-i18n="page.pereyti_k_soderzhimomu"></a>
  <p class="concept-note" data-i18n="page.kontsept_dlya_konkursa_mgimo"></p>

  <header class="app-header">
    <div class="app-header__inner">
      <a class="logo" href="/home">
        <img src="/img/logo.svg" alt="" width="32" height="32">
        <span data-i18n="page.tsifrovoy_dekanat"></span>
      </a>
      <nav class="nav" data-i18n-attr="aria-label=page.razdely">
        <a class="nav__item" href="/home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
          <span data-i18n="page.glavnaya"></span>
        </a>
        <a class="nav__item nav__item--wide" id="nav-notifications" href="/notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="nav__label" id="nav-notifications-label" data-i18n="page.uvedomleniya"></span>
          <span class="nav__count" id="nav-count" hidden></span>
        </a>
        <div class="nav__group" data-i18n="page.ucheba"></div>
        <a class="nav__item" href="/today">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/></svg>
          <span data-i18n="page.raspisanie"></span>
        </a>
        <a class="nav__item" href="/grades">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 5-10 5L2 8z"/><path d="M6 10.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/><path d="M22 8v6"/></svg>
          <span data-i18n="page.otsenki"></span>
        </a>
        <div class="nav__group" data-i18n="page.dokumenty"></div>
        <a class="nav__item" href="/requests">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
          <span data-i18n="page.zayavki"></span>
        </a>
        <a class="nav__item nav__item--wide" id="nav-student-card" href="/student-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M5.5 16c.6-1.6 2-2.4 3.5-2.4s2.9.8 3.5 2.4M15 10h3M15 14h3"/></svg>
          <span data-i18n="page.studencheskiy"></span>
        </a>
        <div class="nav__group" data-i18n="page.studencheskaya_zhizn"></div>
        <a class="nav__item nav__item--wide" href="/grades/bonus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg>
          <span data-i18n="page.aktivnosti_i_nadbavka"></span>
        </a>
        <a class="nav__item nav__item--wide nav__item--bottom" href="/help">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 2-2.3 3.5"/><path d="M12 17.2v.1"/></svg>
          <span data-i18n="page.pomosch"></span>
        </a>
        <a class="nav__item" href="/profile" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span data-i18n="page.profil"></span>
        </a>
      </nav>
      <a class="bell header-card" id="header-card" href="/student-card" data-i18n-attr="aria-label=page.studencheskiy_bilet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M5.5 16c.6-1.6 2-2.4 3.5-2.4s2.9.8 3.5 2.4M15 10h3M15 14h3"/></svg>
      </a>
      <a class="bell" id="bell" href="/notifications" data-i18n-attr="aria-label=page.uvedomleniya">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="bell__count" id="bell-count" hidden></span>
      </a>
      <p class="sidebar-note" data-i18n="page.kontsept_dlya_konkursa_mgimo"></p>
    </div>
  </header>

  <main class="app-main app-main--wide" id="main" tabindex="-1">
    <h1 class="page-title" id="page-title" data-i18n="page.profil"></h1>

    <!-- На компьютере: слева карточка студента, справа настройки и полезное -->
    <div class="split split--profile">
    <div class="split__side">
    <div class="card">
      <div class="state skeleton" id="state-loading" role="status" data-skeleton="profile"><span class="visually-hidden" data-i18n="page.zagruzhaem_profil"></span></div>
      <p class="state state--error" id="state-error" role="alert" hidden></p>

      <div id="profile" hidden>
        <div class="profile-head">
          <div class="avatar" id="avatar" aria-hidden="true"></div>
          <div>
            <p class="profile-name" id="full-name"></p>
            <p class="profile-role" id="role"></p>
          </div>
        </div>
        <dl class="fields" id="fields"></dl>
      </div>
    </div>

    </div>
    <div class="split__main">
    <!-- ВРЕМЕННО: сравнение вариантов фона на Главной, в Расписании (день) и Оценках. Убрать после выбора. -->
    <fieldset class="card theme-picker">
      <legend class="theme-picker__title" data-i18n="page.paper_title"></legend>
      <p class="muted theme-picker__hint" data-i18n="page.paper_hint"></p>
      <div class="theme-options">
        <label class="theme-option"><input type="radio" name="paper" value="current"><span class="theme-option__text"><span class="theme-option__name" data-i18n="page.paper_current"></span><span class="theme-option__hint" data-i18n="page.paper_current_hint"></span></span></label>
        <label class="theme-option"><input type="radio" name="paper" value="a"><span class="theme-option__text"><span class="theme-option__name" data-i18n="page.paper_a"></span><span class="theme-option__hint" data-i18n="page.paper_a_hint"></span></span></label>
        <label class="theme-option"><input type="radio" name="paper" value="b"><span class="theme-option__text"><span class="theme-option__name" data-i18n="page.paper_b"></span><span class="theme-option__hint" data-i18n="page.paper_b_hint"></span></span></label>
      </div>
    </fieldset>
    <fieldset class="card theme-picker">
      <legend class="theme-picker__title" data-i18n="page.oformlenie"></legend>
      <p class="muted theme-picker__hint" data-i18n="page.menyaetsya_srazu_vybor_zapominaetsya"></p>
      <div class="theme-options">
        <label class="theme-option">
          <input type="radio" name="theme" value="classic">
          <span class="theme-swatch theme-swatch--classic" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="theme-option__text">
            <span class="theme-option__name" data-i18n="page.mgimo_klassika"></span>
            <span class="theme-option__hint" data-i18n="page.siniy_s_zolotom_zagolovki"></span>
          </span>
        </label>
        <label class="theme-option">
          <input type="radio" name="theme" value="dark">
          <span class="theme-swatch theme-swatch--dark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="theme-option__text">
            <span class="theme-option__name" data-i18n="page.temnyy"></span>
            <span class="theme-option__hint" data-i18n="page.yarkie_aktsenty_na_temnom"></span>
          </span>
        </label>
      </div>
    </fieldset>

    <section class="card lang-card" aria-labelledby="lang-card-title">
      <h2 class="section-title" id="lang-card-title" data-i18n="lang.title"></h2>
      <p class="muted lang-card__hint" data-i18n="lang.hint"></p>
      <div data-lang-switch></div>
    </section>

    <section class="card useful" id="useful" aria-labelledby="useful-title" hidden>
      <h2 class="section-title" id="useful-title" data-i18n="page.poleznoe"></h2>
      <dl class="useful__list" id="useful-list"></dl>
    </section>

    <section class="card app-block" id="app-block" aria-labelledby="app-block-title" hidden>
      <h2 class="section-title" id="app-block-title" data-i18n="page.prilozhenie"></h2>
      <div class="app-block__body"></div>
    </section>

    <a class="button-link help-profile-link" href="/help" data-i18n="page.pomosch_otvety_na_chastye"></a>
    <button class="button button--secondary logout" type="button" id="logout-button" data-i18n="page.vyyti_iz_kabineta"></button>
    </div>
    </div>
  </main>

  <footer class="app-footer" data-i18n="page.vse_dannye_vymyshleny"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/card-full.js"></script>
  <script src="/js/assistant.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
