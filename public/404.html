<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.takoy_stranitsy_net_tsifrovoy"></title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <script src="/i18n/ru.js"></script>
  <script src="/i18n/en.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page error-page">
  <p class="concept-note" data-i18n="page.kontsept_dlya_konkursa_mgimo"></p>

  <main class="app-main" id="main">
    <div class="login-brand">
      <a class="logo" href="/">
        <img src="/img/logo.svg" alt="" width="44" height="44">
        <span data-i18n="page.tsifrovoy_dekanat"></span>
      </a>
    </div>

    <div class="card error-card">
      <div class="error-card__illu" data-illu="lost"></div>
      <p class="error-card__code" data-i18n="page.oshibka_404"></p>
      <h1 class="page-title error-card__title" data-i18n="page.takoy_stranitsy_net"></h1>
      <p class="muted error-card__text" data-i18n="page.vozmozhno_ssylka_ustarela_ili"></p>
      <a class="button error-card__button" href="/" data-i18n="page.na_glavnuyu"></a>
    </div>
  </main>

  <footer class="app-footer" data-i18n="page.vse_dannye_vymyshleny"></footer>
  <script src="/js/common.js"></script>
  <script src="/js/error-page.js"></script>
</body>
</html>
